name: Web CI

on:
  pull_request:
    paths:
      - "web/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/web-ci.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/web-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build design tokens
        run: pnpm tokens:build

      - name: Build web app
        run: pnpm -F @chef/web build
        env:
          GEMINI_API_KEY: test_key

      - name: Unit tests
        run: pnpm -F @chef/web test

      - name: Install Playwright Chromium
        run: pnpm -F @chef/web exec playwright install chromium --with-deps

      - name: E2E (mocked funnel + demo cook)
        run: pnpm -F @chef/web test:e2e
        env:
          GEMINI_API_KEY: test_key
          CI: "true"
