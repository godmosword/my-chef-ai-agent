# LEGACY: LINE Bot on Render. Web 產品為 apps/web（Vercel）。見 docs/LEGACY_LINE_BOT.md
services:
  - type: web
    name: my-chef-ai-agent
    env: python
    rootDir: apps/line-bot
    buildCommand: >-
      cd ../.. && corepack enable && pnpm install && pnpm tokens:build
      && cp packages/design-tokens/dist/tokens.py apps/line-bot/app/_generated_tokens.py
      && cd apps/line-bot && pip install -r requirements.txt
      && python -m playwright install --with-deps chromium
      && apt-get update && apt-get install -y --no-install-recommends fonts-noto-cjk
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: "8000"
      - key: MODEL_NAME
        value: "gemini-3.1-flash-lite"
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: IMAGE_PROVIDER
        sync: false
      - key: IMAGE_OPENAI_API_KEY
        sync: false
      - key: PUBLIC_APP_BASE_URL
        sync: false
      - key: AI_IMAGE_TIMEOUT_SEC
        sync: false
      - key: IMAGE_CACHE_TTL_SEC
        sync: false
      - key: RECIPE_IMAGE_STORAGE_BACKEND
        sync: false
      - key: RECIPE_IMAGE_GCS_BUCKET
        sync: false
      - key: RECIPE_IMAGE_GCS_PREFIX
        sync: false
      - key: RECIPE_IMAGE_GCS_SIGNED_URL_TTL_SEC
        sync: false
